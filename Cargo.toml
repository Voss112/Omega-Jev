[package]
name = "omega"
version = "0.9.11"
edition = "2024"
description = "Omega — agent IA local et anonyme : Jev (System One) route, DeepSeek V4.1 Flash ou Claude (System Two) exécute"
license = "MIT"
publish = false

[dependencies]
# UI
eframe = "0.37"
egui_commonmark = { version = "0.26", default-features = false, features = ["pulldown_cmark", "better_syntax_highlighting"] }
# Coloration du code dans l'explorateur de fichiers (déjà tiré par egui_commonmark : rien de plus à compiler)
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
# Repérage des tableaux markdown (même version qu'egui_commonmark : rien de plus à compiler)
pulldown-cmark = { version = "0.13", default-features = false }
rfd = "0.17"
open = "5"
# Images collées / déposées (arboard est déjà tiré par egui pour le presse-papiers texte)
arboard = { version = "3", features = ["image-data"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
# Dictée vocale locale : micro (WASAPI) + Whisper (whisper.cpp), rien ne quitte la machine
cpal = "0.18"
# Copie de whisper-rs 0.16.0 : seul changement, le type des enums C sous Windows/MinGW (voir vendor/README.md)
whisper-rs = { path = "vendor/whisper-rs", features = ["vulkan"] }

# Runtime & réseau
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "stream", "socks", "gzip", "brotli", "http2", "charset", "query", "form"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"

# Données
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "7"
anyhow = "1"
regex = "1"
similar = "3"
base64 = "0.23"
ring = "0.17"

# Intelligence code (remplace Serena + code-review-graph + rtk/ripgrep)
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-bash = "0.25"
petgraph = "0.8"
ignore = "0.4"
grep-searcher = "0.1"
grep-regex = "0.1"

# Web local
scraper = "0.29"
htmd = "0.5"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Credentials", "Win32_System_Registry", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse"] }

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# A panic in a tool or a parser library (untrusted input) must stay a failed tool call, not a crash:
# the code catches it through JoinError, which needs unwinding.
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2
